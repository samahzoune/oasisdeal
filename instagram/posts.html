<style>
  :root{ --ink:#181A2E; --majorelle:#4B3FCB; --majorelle-deep:#241F5E; --saffron:#E8A33D; --sand:#F4ECDD; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#211d3b;color:#fff;font-family:'Inter',sans-serif;padding:32px 16px 80px;}
  .head{max-width:900px;margin:0 auto 24px;text-align:center;}
  .head h1{font-family:'Fraunces',serif;font-size:2rem;margin-bottom:8px;}
  .head p{opacity:.7;line-height:1.6;font-size:.95rem;}
  #dlall{display:block;margin:0 auto 24px;background:var(--saffron);color:var(--ink);border:none;padding:12px 24px;border-radius:999px;font-size:.95rem;font-weight:700;cursor:pointer;}
  .grid{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;max-width:1460px;margin:0 auto;}
  .card{background:#2b2650;border-radius:16px;padding:16px;width:380px;}
  .frame{width:348px;height:435px;overflow:hidden;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.4);}
  .stage{width:1080px;height:1350px;transform-origin:top left;transform:scale(.32222);position:relative;overflow:hidden;background:var(--majorelle-deep);}
  .stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .stage .grad-top{position:absolute;top:0;left:0;right:0;height:300px;background:linear-gradient(180deg,rgba(20,16,45,.72),rgba(20,16,45,0));}
  .stage .grad-bot{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(0deg,rgba(16,12,40,.95) 0%,rgba(16,12,40,.76) 44%,rgba(16,12,40,0) 100%);}
  .stage.plain .grad-bot{height:1350px;background:linear-gradient(160deg,var(--majorelle) 0%,var(--majorelle-deep) 100%);}
  .stage .inner{position:absolute;inset:0;padding:76px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:18px;}
  .brand .mark{width:62px;height:62px;flex:none;}
  .brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:42px;letter-spacing:-.01em;}
  .brand .word .pipe{color:var(--saffron);font-weight:400;}
  .body{margin-top:auto;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:27px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);font-weight:600;margin-bottom:26px;}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:94px;line-height:1.03;margin-bottom:26px;}
  .title em{font-style:italic;color:var(--saffron);}
  .sub{font-size:38px;line-height:1.4;color:rgba(255,255,255,.88);max-width:900px;}
  .pill{margin-top:46px;display:inline-flex;align-items:center;gap:14px;background:var(--saffron);color:var(--ink);font-weight:700;font-size:33px;padding:22px 38px;border-radius:999px;align-self:flex-start;}
  .plain .badge{position:absolute;top:76px;right:76px;background:var(--saffron);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:25px;letter-spacing:.1em;padding:13px 24px;border-radius:999px;text-transform:uppercase;}
  .capbox{margin-top:14px;background:#211d3b;border-radius:8px;padding:12px;font-size:.82rem;line-height:1.5;white-space:pre-line;color:rgba(255,255,255,.9);max-height:180px;overflow:auto;}
  .meta{margin-top:10px;font-size:.78rem;line-height:1.5;}
  .meta b{color:var(--saffron);font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;}
  .btns{display:flex;gap:8px;margin-top:12px;}
  button.act{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-weight:600;font-size:.85rem;}
  .dl{background:var(--saffron);color:var(--ink);flex:1;}
  .cp{background:#43407a;color:#fff;}
  button.act:hover{opacity:.9;}
</style>

var grid = document.getElementById('grid');
POSTS.forEach(function(p, i){
  var card = document.createElement('div'); card.className='card';
  var stage =
    '<div class="stage '+(p.plain?'plain':'')+'" id="stage'+i+'">'
    + (p.plain? '' : '<img class="bg" crossorigin="anonymous" src="../images/destinations/'+p.img+'.jpg" />')
    + '<div class="grad-top"></div><div class="grad-bot"></div>'
    + (p.plain? '<div class="badge">'+p.badge+'</div>' : '')
    + '<div class="inner"><div class="brand">'+LOGO+'<span class="word">Oasis<span class="pipe">|</span>Deal</span></div>'
    +   '<div class="body"><div class="eyebrow">'+p.eyebrow+'</div><div class="title">'+p.title+'</div>'
    +   '<div class="sub">'+p.sub+'</div><div class="pill">oasisdeal.com</div></div></div></div>';
  card.appendChild(el('div','frame',stage));
  var cap = document.createElement('div'); cap.className='capbox'; cap.id='cap'+i; cap.textContent=p.cap; card.appendChild(cap);
  card.appendChild(el('div','btns',
      '<button class="act dl" data-i="'+i+'" data-f="'+p.file+'">⬇ Download PNG</button>'
    + '<button class="act cp" data-c="'+i+'">Copy caption</button>'));
  grid.appendChild(card);
});
function el(t,c,h){var d=document.createElement(t);d.className=c;d.innerHTML=h;return d;}

function shoot(i, file){
  var stage=document.getElementById('stage'+i); var prev=stage.style.transform; stage.style.transform='none';
  return html2canvas(stage,{useCORS:true,backgroundColor:null,width:1080,height:1350,scale:1}).then(function(c){
    stage.style.transform=prev;
    var a=document.createElement('a'); a.download=file+'.png'; a.href=c.toDataURL('image/png'); a.click();
  }).catch(function(e){ stage.style.transform=prev; alert('Export failed: '+e); });
}
document.addEventListener('click', function(e){
  if(e.target.classList.contains('dl')){ shoot(+e.target.dataset.i, e.target.dataset.f); }
  if(e.target.classList.contains('cp')){ var t=document.getElementById('cap'+e.target.dataset.c).textContent; navigator.clipboard.writeText(t); e.target.textContent='Copied!'; setTimeout(function(){e.target.textContent='Copy caption';},1200); }
});
document.getElementById('dlall').addEventListener('click', function(){
  var i=0; (function next(){ if(i>=POSTS.length)return; shoot(i,POSTS[i].file).then(function(){ i++; setTimeout(next,600); }); })();
});
</script>
