<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>OasisDeal — Instagram Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --ink:#181A2E; --majorelle:#4B3FCB; --majorelle-deep:#241F5E; --saffron:#E8A33D; --sand:#F4ECDD; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#211d3b;color:#fff;font-family:'Inter',sans-serif;padding:32px 16px 80px;}
  .head{max-width:900px;margin:0 auto 24px;text-align:center;}
  .head h1{font-family:'Fraunces',serif;font-size:2rem;margin-bottom:8px;}
  .head p{opacity:.7;line-height:1.6;font-size:.95rem;}
  #dlall{display:block;margin:0 auto 24px;background:var(--saffron);color:var(--ink);border:none;padding:12px 24px;border-radius:999px;font-size:.95rem;font-weight:700;cursor:pointer;}
  .grid{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;max-width:1460px;margin:0 auto;}
  .card{background:#2b2650;border-radius:16px;padding:16px;width:380px;}
  .frame{width:348px;height:435px;overflow:hidden;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.4);}
  .stage{width:1080px;height:1350px;transform-origin:top left;transform:scale(.32222);position:relative;overflow:hidden;background:var(--majorelle-deep);}
  .stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .stage .grad-top{position:absolute;top:0;left:0;right:0;height:300px;background:linear-gradient(180deg,rgba(20,16,45,.72),rgba(20,16,45,0));}
  .stage .grad-bot{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(0deg,rgba(16,12,40,.95) 0%,rgba(16,12,40,.76) 44%,rgba(16,12,40,0) 100%);}
  .stage.plain .grad-bot{height:1350px;background:linear-gradient(160deg,var(--majorelle) 0%,var(--majorelle-deep) 100%);}
  .stage .inner{position:absolute;inset:0;padding:76px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:18px;}
  .brand .mark{width:62px;height:62px;flex:none;}
  .brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:42px;letter-spacing:-.01em;}
  .brand .word .pipe{color:var(--saffron);font-weight:400;}
  .body{margin-top:auto;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:27px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);font-weight:600;margin-bottom:26px;}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:94px;line-height:1.03;margin-bottom:26px;}
  .title em{font-style:italic;color:var(--saffron);}
  .sub{font-size:38px;line-height:1.4;color:rgba(255,255,255,.88);max-width:900px;}
  .pill{margin-top:46px;display:inline-flex;align-items:center;gap:14px;background:var(--saffron);color:var(--ink);font-weight:700;font-size:33px;padding:22px 38px;border-radius:999px;align-self:flex-start;}
  .plain .badge{position:absolute;top:76px;right:76px;background:var(--saffron);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:25px;letter-spacing:.1em;padding:13px 24px;border-radius:999px;text-transform:uppercase;}
  .capbox{margin-top:14px;background:#211d3b;border-radius:8px;padding:12px;font-size:.82rem;line-height:1.5;white-space:pre-line;color:rgba(255,255,255,.9);max-height:180px;overflow:auto;}
  .meta{margin-top:10px;font-size:.78rem;line-height:1.5;}
  .meta b{color:var(--saffron);font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;}
  .btns{display:flex;gap:8px;margin-top:12px;}
  button.act{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-weight:600;font-size:.85rem;}
  .dl{background:var(--saffron);color:var(--ink);flex:1;}
  .cp{background:#43407a;color:#fff;}
  button.act:hover{opacity:.9;}
</style>
</head>
<body>
<div class="head">
  <h1>OasisDeal — Instagram Posts</h1>
  <p>10 ready-to-post graphics (1080×1350). Click <b>Download PNG</b>, then in Instagram: new post → upload → paste the caption (Copy caption). Captions say "link in bio", so keep <b>oasisdeal.com</b> in your bio. Post ~1 per day.</p>
</div>
<button id="dlall">⬇ Download all 10 PNGs</button>
<div class="grid" id="grid"></div>

<script>
var LOGO = '<svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="15" fill="#E8A33D"/><path d="M16 22c0-7 3-10 8-11-1 6-3 9-8 11z" fill="#241F5E"/><path d="M16 22c0-7-3-10-8-11 1 6 3 9 8 11z" fill="#4B3FCB"/><rect x="14.6" y="20" width="2.8" height="5" rx="1" fill="#241F5E"/></svg>';

var POSTS = [
  {file:'ig-dubai', img:'dubai', eyebrow:'Destination Guide', title:'Best Time to Visit <em>Dubai</em>', sub:'The best months for weather & prices — and when to skip the heat.',
   cap:"🌇 Thinking about Dubai? Here's when to go 👇\n\n☀️ Nov–March: warm, sunny, perfect\n🔥 June–Sept: 40°C+ but the cheapest flights & hotels\n✨ April, May & Oct: the sweet spot — still warm, fewer crowds, better prices\n\n✈️ Full guide + live flight prices → link in bio\nSave this for your next trip 📌\n\n#Dubai #DubaiTravel #TravelTips #CheapFlights #TravelGuide #BucketList #Wanderlust #TravelDeals"},
  {file:'ig-cheapest', img:'istanbul', eyebrow:'Flight Tips', title:'Cheapest Time to Book <em>Flights</em>', sub:'Book at the right time and the same seat costs far less.',
   cap:"🎯 The same seat can cost WAY less — if you time it right.\n\n📅 Book 4–8 weeks ahead for international flights\n🗓️ Fly mid-week (Tue/Wed)\n☀️ Avoid summer & Eid peaks\n💡 Compare every airline in one search\n\nSave this ✈️ Full guide → link in bio\n\n#CheapFlights #TravelHacks #TravelTips #BudgetTravel #FlightDeals #Wanderlust #TravelSmart"},
  {file:'ig-10tips', img:'paris', eyebrow:'Flight Hacks', title:'10 Tips for <em>Cheap Flights</em>', sub:'Simple habits that consistently lower the price of your flights.',
   cap:"✈️ 10 ways to find cheaper flights (save this 📌)\n\n1️⃣ Compare every airline in ONE search\n2️⃣ Fly mid-week\n3️⃣ Book 4–8 weeks ahead\n4️⃣ Travel off-season\n5️⃣ Check nearby airports\n…+ 5 more → link in bio\n\n#CheapFlights #TravelHacks #BudgetTravel #TravelTips #FlightDeals #TravelSmart #Wanderlust"},
  {file:'ig-tokyo', img:'tokyo', eyebrow:'Destination Guide', title:'Tokyo <em>Travel Guide</em>', sub:'Best time to go, top things to do, and what flights really cost.',
   cap:"🇯🇵 Tokyo is calling.\n\nNeon nights, ancient temples, and the best food on earth 🍜 Here's the best time to visit, top things to do, and live flight prices.\n\nStart planning → link in bio ✈️\n\n#Tokyo #Japan #JapanTravel #TravelGuide #BucketList #Wanderlust #TravelInspiration #Asia"},
  {file:'ig-wintersun', img:'bali', eyebrow:'Destinations', title:'Best <em>Winter Sun</em> Escapes', sub:'Escape the cold — warm, sunny places for a winter getaway.',
   cap:"❄️➡️☀️ Escape the cold this winter.\n\n🏖️ Dubai & the Gulf\n🌴 Thailand & Bali\n🌞 The Canary Islands\n🐠 Egypt's Red Sea\n🍷 Southern Spain & Portugal\n\nWhere would you go? 👇 Full list → link in bio\n\n#WinterSun #TravelInspiration #BeachHoliday #Wanderlust #TravelGuide #BucketList #TravelDeals"},
  {file:'ig-europe', img:'barcelona', eyebrow:'Europe', title:'Best Time to Visit <em>Europe</em>', sub:'When to go for good weather, fewer crowds and lower prices.',
   cap:"🇪🇺 When's the BEST time to visit Europe?\n\n🌸 April–June & Sept–Oct: mild weather, fewer crowds, cheaper flights\n☀️ Summer: busy & pricey\n❄️ Winter: quiet & cheapest\n\nPlan it right → link in bio ✈️\n\n#Europe #EuropeTravel #TravelTips #TravelGuide #Wanderlust #BucketList #CheapFlights"},
  {file:'ig-jetlag', img:'bangkok', eyebrow:'Travel Tips', title:'How to Beat <em>Jet Lag</em>', sub:'Science-backed ways to feel good from day one.',
   cap:"😴 Beat jet lag like a pro ✈️\n\n💧 Hydrate — skip the alcohol\n🕐 Switch to destination time on the plane\n☀️ Get daylight the moment you land\n🚫 No long naps on day one\n\nMore tips → link in bio. Save for your next long-haul!\n\n#TravelTips #TravelHacks #JetLag #LongHaulFlight #TravelSmart #Wanderlust"},
  {file:'ig-esim', plain:true, badge:'eSIM', eyebrow:'Travel Tech', title:'Online Abroad in <em>60 Seconds</em>', sub:'A travel eSIM = data the moment you land. No roaming bills.',
   cap:"📱 Landed. Online in 60 seconds. Zero roaming bills.\n\nA travel eSIM gives you data the moment you arrive — no SIM kiosks, no shock charges. We compare the best ones for your destination, cheapest first.\n\nHow it works → link in bio\n\n#eSIM #TravelTech #TravelTips #DigitalNomad #TravelHacks #TravelEssentials #Wanderlust"},
  {file:'ig-compensation', plain:true, badge:'Your rights', eyebrow:'Passenger Rights', title:'Delayed Flight? Get up to <em>€600</em>', sub:'A free 2-minute check under EU law (EC 261) — even past flights.',
   cap:"💶 Flight delayed or cancelled? You might be owed up to €600.\n\nUnder EU law (EC261), even PAST flights can qualify — and it's a free 2-minute check. Most people never claim what they're owed.\n\nCheck if you're owed → link in bio\n\n#FlightDelay #TravelTips #PassengerRights #TravelHacks #KnowYourRights #Travel #Wanderlust"},
  {file:'ig-brand', plain:true, badge:'OasisDeal', eyebrow:'Compare & save', title:'Cheap Flights, <em>Compared</em>', sub:'Hundreds of sites, one search. Cheapest first. No booking fees.',
   cap:"✈️ Meet OasisDeal — your savings oasis for travel 🌍\n\nCompare cheap flights, hotels & travel eSIMs from hundreds of sites in one search. Cheapest first. No booking fees. Plus honest travel tips & destination guides.\n\nFollow for cheap-flight hacks & destination inspo 📌 Start → link in bio\n\n#CheapFlights #TravelDeals #BudgetTravel #TravelTips #Wanderlust #TravelInspiration #TravelHacks"}
];

var grid = document.getElementById('grid');
POSTS.forEach(function(p, i){
  var card = document.createElement('div'); card.className='card';
  var stage =
    '<div class="stage '+(p.plain?'plain':'')+'" id="stage'+i+'">'
    + (p.plain? '' : '<img class="bg" crossorigin="anonymous" src="../images/destinations/'+p.img+'.jpg" />')
    + '<div class="grad-top"></div><div class="grad-bot"></div>'
    + (p.plain? '<div class="badge">'+p.badge+'</div>' : '')
    + '<div class="inner"><div class="brand">'+LOGO+'<span class="word">Oasis<span class="pipe">|</span>Deal</span></div>'
    +   '<div class="body"><div class="eyebrow">'+p.eyebrow+'</div><div class="title">'+p.title+'</div>'
    +   '<div class="sub">'+p.sub+'</div><div class="pill">oasisdeal.com</div></div></div></div>';
  card.appendChild(el('div','frame',stage));
  var cap = document.createElement('div'); cap.className='capbox'; cap.id='cap'+i; cap.textContent=p.cap; card.appendChild(cap);
  card.appendChild(el('div','btns',
      '<button class="act dl" data-i="'+i+'" data-f="'+p.file+'">⬇ Download PNG</button>'
    + '<button class="act cp" data-c="'+i+'">Copy caption</button>'));
  grid.appendChild(card);
});
function el(t,c,h){var d=document.createElement(t);d.className=c;d.innerHTML=h;return d;}

function shoot(i, file){
  var stage=document.getElementById('stage'+i); var prev=stage.style.transform; stage.style.transform='none';
  return html2canvas(stage,{useCORS:true,backgroundColor:null,width:1080,height:1350,scale:1}).then(function(c){
    stage.style.transform=prev;
    var a=document.createElement('a'); a.download=file+'.png'; a.href=c.toDataURL('image/png'); a.click();
  }).catch(function(e){ stage.style.transform=prev; alert('Export failed: '+e); });
}
document.addEventListener('click', function(e){
  if(e.target.classList.contains('dl')){ shoot(+e.target.dataset.i, e.target.dataset.f); }
  if(e.target.classList.contains('cp')){ var t=document.getElementById('cap'+e.target.dataset.c).textContent; navigator.clipboard.writeText(t); e.target.textContent='Copied!'; setTimeout(function(){e.target.textContent='Copy caption';},1200); }
});
document.getElementById('dlall').addEventListener('click', function(){
  var i=0; (function next(){ if(i>=POSTS.length)return; shoot(i,POSTS[i].file).then(function(){ i++; setTimeout(next,600); }); })();
});
</script>
</body>
</html>
