<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>OasisDeal — Pinterest Pins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#181A2E; --majorelle:#4B3FCB; --majorelle-deep:#241F5E;
    --clay:#D97D4C; --saffron:#E8A33D; --sand:#F4ECDD; --paper:#FFFBF5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#211d3b;color:#fff;font-family:'Inter',sans-serif;padding:32px 16px 80px;}
  .head{max-width:900px;margin:0 auto 28px;text-align:center;}
  .head h1{font-family:'Fraunces',serif;font-size:2rem;margin-bottom:8px;}
  .head p{opacity:.7;line-height:1.6;font-size:.95rem;}
  .grid{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;max-width:1400px;margin:0 auto;}
  .card{background:#2b2650;border-radius:16px;padding:16px;width:360px;}
  .frame{width:328px;height:492px;overflow:hidden;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.4);}
  /* the actual pin, full 1000x1500, scaled down for display */
  .stage{width:1000px;height:1500px;transform-origin:top left;transform:scale(.328);position:relative;overflow:hidden;background:var(--majorelle-deep);}
  .stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .stage .grad-top{position:absolute;top:0;left:0;right:0;height:320px;background:linear-gradient(180deg,rgba(20,16,45,.72),rgba(20,16,45,0));}
  .stage .grad-bot{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(0deg,rgba(16,12,40,.94) 0%,rgba(16,12,40,.75) 42%,rgba(16,12,40,0) 100%);}
  .stage.plain .grad-bot{height:1500px;background:linear-gradient(160deg,var(--majorelle) 0%,var(--majorelle-deep) 100%);}
  .stage .inner{position:absolute;inset:0;padding:70px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:18px;}
  .brand .mark{width:60px;height:60px;flex:none;}
  .brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:40px;letter-spacing:-.01em;}
  .brand .word .pipe{color:var(--saffron);font-weight:400;}
  .body{margin-top:auto;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);font-weight:600;margin-bottom:26px;}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:88px;line-height:1.04;margin-bottom:26px;}
  .title em{font-style:italic;color:var(--saffron);}
  .sub{font-size:36px;line-height:1.4;color:rgba(255,255,255,.86);max-width:820px;}
  .url{margin-top:44px;display:inline-flex;align-items:center;gap:14px;background:var(--saffron);color:var(--ink);font-weight:700;font-size:32px;padding:20px 34px;border-radius:999px;align-self:flex-start;}
  .plain .badge{position:absolute;top:70px;right:70px;background:var(--saffron);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:24px;letter-spacing:.1em;padding:12px 22px;border-radius:999px;text-transform:uppercase;}
  .cap{margin-top:14px;font-size:.86rem;line-height:1.5;}
  .cap .row{margin-bottom:8px;}
  .cap b{color:var(--saffron);font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px;opacity:.9;}
  .cap .desc{color:rgba(255,255,255,.82);}
  .cap .link{color:#9db4ff;word-break:break-all;}
  .btns{display:flex;gap:8px;margin-top:12px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-weight:600;font-size:.85rem;}
  .dl{background:var(--saffron);color:var(--ink);flex:1;}
  .cp{background:#43407a;color:#fff;}
  button:hover{opacity:.9;}
  #dlall{display:block;margin:0 auto 24px;background:var(--saffron);color:var(--ink);padding:12px 24px;border-radius:999px;font-size:.95rem;}
</style>
</head>
<body>
<div class="head">
  <h1>OasisDeal — Pinterest Pins</h1>
  <p>10 ready-to-upload pins (1000×1500). Click <b>Download PNG</b> on each, then in Pinterest: Create Pin → upload the image → paste the title + description → add the destination link → pick the board.</p>
</div>
<button id="dlall">⬇ Download all 10 PNGs</button>
<div class="grid" id="grid"></div>

   path:'/destinations/austria', board:'Europe Travel',

   path:'/blog/best-time-to-visit-dubai', board:'Dubai Travel',
   desc:'Planning a trip to Dubai? Here’s the best time to visit for great weather and lower prices, plus how to find cheap flights to Dubai. #Dubai #DubaiTravel #TravelTips #CheapFlights'},

   desc:'Get the timing right and the same seat can cost far less. Here’s exactly when to book flights for the lowest price. #CheapFlights #TravelHacks #FlightDeals #BudgetTravel'},
  {file:'pin-10-tips', img:'paris', eyebrow:'Flight Hacks', title:'10 Tips to Find <em>Cheap Flights</em>', sub:'Simple habits that consistently lower the price of your flights.',
   path:'/blog/10-tips-to-find-cheap-flights-from-morocco', board:'Budget Travel Tips & Hacks',
   desc:'Finding a cheap flight isn’t luck — it’s a handful of habits. 10 tips to fly for less every time. #CheapFlights #TravelTips #BudgetTravel #TravelHacks'},
  {file:'pin-tokyo', img:'tokyo', eyebrow:'Destination Guide', title:'Tokyo <em>Travel Guide</em>', sub:'Best time to go, top things to do, and what flights really cost.',
   path:'/destinations/tokyo', board:'Travel Destinations & Guides',
   desc:'Everything for your Tokyo trip: best time to visit, things to do, and live flight prices. #Tokyo #Japan #TravelGuide #BucketList'},

   desc:'When winter hits, a few hours on a plane can take you to summer. The best warm winter-sun destinations. #WinterSun #TravelInspiration #BeachHoliday #TravelGuide'},

   path:'/blog/best-time-to-visit-europe-from-morocco', board:'Europe Travel',
   desc:'The best time to visit Europe for mild weather, smaller crowds and cheaper flights. #Europe #TravelTips #EuropeTravel #CheapFlights'},
  {file:'pin-jetlag', img:'bangkok', eyebrow:'Travel Tips', title:'How to Avoid <em>Jet Lag</em>', sub:'Science-backed ways to beat jet lag on long flights.',
   path:'/blog/how-to-avoid-jet-lag', board:'Budget Travel Tips & Hacks',
   desc:'Crossing time zones? Simple, science-backed tips to beat jet lag and enjoy your trip from day one. #JetLag #TravelTips #LongHaul #TravelHacks'},
  {file:'pin-rome', img:'rome', eyebrow:'Destination Guide', title:'<em>Rome</em> Travel Guide', sub:'The Colosseum, the Vatican and perfect pasta.',

  {file:'pin-london', img:'london', eyebrow:'Destination Guide', title:'<em>London</em> Travel Guide', sub:'Iconic landmarks, free museums, endless things to do.',
   path:'/destinations/london', board:'Europe Travel',
   desc:'London — icons, free world-class museums and diverse food. Best time to visit + live flight prices. #London #UK #LondonTravel #Europe #TravelGuide #Wanderlust'},
  {file:'pin-madrid', img:'madrid', eyebrow:'Destination Guide', title:'<em>Madrid</em> Travel Guide', sub:'Grand plazas, world-class art and buzzing tapas bars.',
   path:'/destinations/madrid', board:'Europe Travel',
   desc:'Madrid — grand plazas, the Prado and late-night tapas. Best time to visit + live flight prices. #Madrid #Spain #SpainTravel #Europe #TravelGuide #Wanderlust'},

   desc:'New York City — skyline, Central Park and Broadway. Best time to visit + live flight prices. #NewYork #NYC #USA #TravelGuide #BucketList #Wanderlust'},

  {file:'pin-kl', img:'kuala-lumpur', eyebrow:'Destination Guide', title:'<em>Kuala Lumpur</em>', sub:'Twin Towers, street food and tropical city buzz.',
   path:'/destinations/kuala-lumpur', board:'Travel Destinations & Guides',
   desc:'Kuala Lumpur — Petronas Towers, incredible street food and tropical vibes. Best time to visit + live flight prices. #KualaLumpur #Malaysia #Asia #TravelGuide #Wanderlust'},
  {file:'pin-jeddah', img:'jeddah', eyebrow:'Destination Guide', title:'<em>Jeddah</em> & Umrah', sub:'Gateway to Makkah — old town, Red Sea and Umrah.',
   path:'/destinations/jeddah', board:'Travel Destinations & Guides',
   desc:'Jeddah — the gateway for Umrah, historic Al-Balad and the Red Sea. Best time to visit + live flight prices. #Jeddah #SaudiArabia #Umrah #TravelGuide #Wanderlust'},
  {file:'pin-esim', plain:true, badge:'eSIM', eyebrow:'Travel Tech', title:'Stay Online Abroad with a <em>Travel eSIM</em>', sub:'No roaming bills, no SIM kiosks. Online the moment you land.',
   path:'/esim', board:'Travel eSIM & Tech',
   desc:'Skip roaming charges. Compare the best travel eSIMs and stay connected abroad from the moment you land. #eSIM #TravelTech #TravelTips #DigitalNomad'},

   desc:'Flight delayed or cancelled? You could be owed up to €600 under EU law — even for past flights. Free check. #FlightDelay #TravelTips #PassengerRights #TravelHacks'},
  {file:'pin-brand', plain:true, badge:'OasisDeal', eyebrow:'Compare & save', title:'Cheap Flights, Hotels & <em>Travel Deals</em>', sub:'Compare hundreds of sites in one search — cheapest first, no booking fees.',

   desc:'Your savings oasis for travel. Compare cheap flights, hotels and travel eSIMs in one search — cheapest first, no fees. #CheapFlights #TravelDeals #BudgetTravel #TravelTips'}

var grid = document.getElementById('grid');
PINS.forEach(function(p, i){
  var card = document.createElement('div'); card.className='card';
  var stageHtml =
    '<div class="stage '+(p.plain?'plain':'')+'" id="stage'+i+'">'
    + (p.plain? '' : '<img class="bg" crossorigin="anonymous" src="../images/destinations/'+p.img+'.jpg" />')
    + '<div class="grad-top"></div><div class="grad-bot"></div>'
    + (p.plain? '<div class="badge">'+p.badge+'</div>' : '')
    + '<div class="inner">'
    +   '<div class="brand">'+LOGO+'<span class="word">Oasis<span class="pipe">|</span>Deal</span></div>'
    +   '<div class="body">'
    +     '<div class="eyebrow">'+p.eyebrow+'</div>'
    +     '<div class="title">'+p.title+'</div>'
    +     '<div class="sub">'+p.sub+'</div>'
    +     '<div class="url">oasisdeal.com'+(p.path==='/'?'':p.path)+'</div>'
    +   '</div>'
    + '</div></div>';
  card.innerHTML =
    '<div class="frame">'+stageHtml+'</div>'
    + '<div class="cap">'
    +   '<div class="row"><b>Title</b><span id="t'+i+'">'+p.title.replace(/<[^>]+>/g,'')+'</span></div>'
    +   '<div class="row"><b>Description</b><span class="desc" id="d'+i+'">'+p.desc+'</span></div>'
    +   '<div class="row"><b>Link</b><span class="link">'+SITE+(p.path==='/'?'':p.path)+'</span></div>'
    +   '<div class="row"><b>Board</b><span>'+p.board+'</span></div>'
    + '</div>'
    + '<div class="btns">'
    +   '<button class="dl" data-i="'+i+'" data-f="'+p.file+'">⬇ Download PNG</button>'
    +   '<button class="cp" data-d="'+i+'">Copy desc</button>'
    + '</div>';
  grid.appendChild(card);
});

function shoot(i, file){
  var stage = document.getElementById('stage'+i);
  var prev = stage.style.transform;
  stage.style.transform = 'none';               // full 1000x1500 for capture
  return html2canvas(stage, {useCORS:true, backgroundColor:null, width:1000, height:1500, scale:1}).then(function(canvas){
    stage.style.transform = prev;
    var a = document.createElement('a');
    a.download = file+'.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }).catch(function(e){ stage.style.transform = prev; alert('Export failed: '+e); });
}

document.addEventListener('click', function(e){
  if(e.target.classList.contains('dl')){ shoot(+e.target.dataset.i, e.target.dataset.f); }
  if(e.target.classList.contains('cp')){
    var d = document.getElementById('d'+e.target.dataset.d).textContent;
    navigator.clipboard.writeText(d); e.target.textContent='Copied!'; setTimeout(function(){e.target.textContent='Copy desc';},1200);
  }
});
document.getElementById('dlall').addEventListener('click', function(){
  var i=0; (function next(){ if(i>=PINS.length)return; shoot(i, PINS[i].file).then(function(){ i++; setTimeout(next, 600); }); })();
});
</script>
</body>
</html>
